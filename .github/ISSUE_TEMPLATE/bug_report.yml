name: Bug report
description: Report a reproducible problem in ASC
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest reproducible example.
    validations:
      required: true
